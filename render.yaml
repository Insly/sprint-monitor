# Render Blueprint for the MGA Sprint Board (static site, no build step).
# NOT APPLIED: Render has no GitHub app access to this repo, so this Blueprint is not synced. Deploys go via the
# deploy hook that CI calls after the tests pass on main (.github/workflows/deploy.yml); a push alone does not
# deploy. Kept as the record of the intended service settings: the live ones are set in the Render dashboard.
# Static sites do not sleep, so the page opens instantly.
services:
  - type: web
    name: insly-sprint-monitor
    runtime: static
    buildCommand: echo "no build step"
    staticPublishPath: public
    buildFilter:
      paths:
        - public/**
    headers:
      # Updated rules.js / schedule.js must show up on the next page load.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
